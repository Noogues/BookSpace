services:

  postgres:
    image: postgres:17
    container_name: bookspace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: bookspace-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL no definido en .env}
      NODE_ENV: ${NODE_ENV}
      COVERS_DIR: /app/data/covers
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER no definido en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD no definido en .env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET no definido en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./data/covers:/app/data/covers

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: bookspace-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8080:80"

  caddy:
    image: caddy:2
    container_name: bookspace-caddy
    profiles: ["https"]
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN:?DOMAIN no definido en .env}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config: