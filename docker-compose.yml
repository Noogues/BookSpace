services:

  postgres:
    image: postgres:17
    container_name: bookspace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books
      POSTGRES_DB: bookspace

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d bookspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: bookspace-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://books:books@postgres:5432/bookspace}
      NODE_ENV: production

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./data/covers:/app/data/covers

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: bookspace-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8080:80"

volumes:
  postgres_data: