services:

  postgres:
    ports:
      - "5433:5432"

  backend:
    environment:
      NODE_ENV: development
      COVERS_DIR: /app/data/covers
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_generated:/app/generated

  frontend:
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  backend_generated:
  frontend_node_modules: